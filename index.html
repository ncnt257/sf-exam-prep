<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 5C21 5 17.5 7 15.5 10C14 8.5 12 7.5 9.5 7.5C4.5 7.5 0.5 11.5 0.5 16.5C0.5 18 0.9 19.4 1.5 20.7C0.6 22.1 0 23.8 0 25.7C0 31 4.2 35.4 9.5 35.7C10 38 11.3 40 13 41.5C14.5 42.9 16.5 43.7 18.8 43.7C19.8 43.7 20.8 43.5 21.7 43.2C23 44.3 24.7 45 26.5 45C28.5 45 30.3 44.2 31.7 42.9C32.8 43.3 34 43.5 35.2 43.5C40.7 43.5 45.2 39 45.2 33.5C45.2 32.5 45 31.5 44.7 30.6C47.2 28.8 49 26.1 49 22.9C49 17.8 44.8 13.7 39.7 13.7C38.7 13.7 37.8 13.9 36.9 14.2C35.3 9 30.5 5 25 5Z" fill="white" fill-opacity="0.9"/>
    </svg>
    <span>Salesforce Exam Prep</span>
  </div>
  <span class="header-title">Certification Practice</span>
</div>

<div class="container">

  <!-- ══════════ SETUP SCREEN ══════════ -->
  <div id="setup-screen">
    <div class="setup-card">
      <h2>📋 Start Your Practice</h2>
      <p>Select an exam, a year, a topic, and begin.</p>

      <div id="data-ready">

        <!-- ── Loading skeleton (shown while CSV fetches) ── -->
        <div id="loading-state">
          <div class="skeleton-pills">
            <div class="skeleton-pill"></div>
            <div class="skeleton-pill"></div>
            <div class="skeleton-pill"></div>
          </div>
          <div style="width:100%">
            <div class="skeleton-label"></div>
            <div style="position:relative">
              <button type="button" class="search-select-trigger loading-trigger" style="cursor:not-allowed;">
                <span class="trigger-text placeholder">Loading questions…</span>
                <span class="trigger-spinner"></span>
              </button>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:4px;">
            <div class="loading-dots">
              <span></span><span></span><span></span>
            </div>
            <span class="loading-subtext">Fetching exam list</span>
          </div>
        </div>

        <!-- ── Actual content (hidden until data loads) ── -->
        <div id="content-ready" class="hidden">

          <!-- Unfinished attempt saved in localStorage -->
          <div class="resume-banner hidden" id="resume-banner">
            <div class="resume-info" id="resume-info"></div>
            <div class="resume-actions">
              <button class="resume-btn" onclick="resumeProgress()">Resume →</button>
              <button class="discard-btn" onclick="discardProgress()">Discard</button>
            </div>
          </div>

          <!-- Step pills -->
          <div class="step-pills">
            <div class="step-pill active" id="pill-1"><span class="step-num">1</span>Exam</div>
            <div class="step-pill" id="pill-2"><span class="step-num">2</span>Year</div>
            <div class="step-pill" id="pill-3"><span class="step-num">3</span>Options</div>
          </div>

          <!-- ── Step 1: Exam ── -->
          <div id="step-exam">
            <div class="section-divider">Step 1 — Select Exam</div>
            <div class="field-group">
              <label class="field-label">🎯 Exam</label>
              <div class="search-select" id="exam-search-select">
                <button type="button" class="search-select-trigger" id="exam-trigger" onclick="toggleDropdown('exam')">
                  <span class="trigger-text placeholder" id="exam-trigger-text">— Select an exam —</span>
                  <span class="chevron">▾</span>
                </button>
                <div class="search-select-dropdown" id="exam-dropdown">
                  <div class="search-select-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input class="search-select-input" id="exam-search-input" type="text" placeholder="Type to search…"
                      oninput="filterOptions('exam', this.value)" onkeydown="handleSearchKey(event,'exam')">
                  </div>
                  <div class="search-select-list" id="exam-options-list"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- ── Step 2: Year ── -->
          <div id="step-year" class="hidden">
            <div class="section-divider">Step 2 — Select Year</div>
            <div class="field-group">
              <label class="field-label">📅 Year (from created_at)</label>
              <div class="year-grid" id="year-grid"></div>
            </div>
          </div>

          <!-- ── Step 3: Options ── -->
          <div id="step-options" class="hidden">
            <div class="section-divider">Step 3 — Options</div>

            <div class="selection-summary" id="selection-summary"></div>

            <div class="field-group" id="exam-stats-row" style="display:none">
              <div class="stats-row" id="stats-row"></div>
            </div>

            <div class="field-group">
              <label class="field-label">📝 Mode</label>
              <div class="toggle-group">
                <button class="toggle-btn active" data-mode="practice" onclick="selectMode('practice')">🧪 Practice Mode</button>
                <button class="toggle-btn" data-mode="exam" onclick="selectMode('exam')">⏱ Exam Mode</button>
              </div>
            </div>

            <div class="field-group">
              <label class="checkbox-row" for="randomize-cb">
                <input type="checkbox" id="randomize-cb">
                <span>🔀 Randomize question order</span>
              </label>
            </div>

            <button class="start-btn" id="start-btn" onclick="startExam()">Start Exam →</button>
          </div>

        </div><!-- /content-ready -->

      </div><!-- /data-ready -->
    </div>
  </div>

  <!-- ══════════ EXAM SCREEN ══════════ -->
  <div id="exam-screen">
    <div class="exam-topbar">
      <button class="back-btn" onclick="goBack()">← Back</button> 
      <div class="exam-topbar-left">
        <div class="exam-title-sm" id="topbar-title">—</div>
        <div class="mode-badge" id="mode-badge">Practice</div>
      </div>
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div class="progress-row">
          <span id="progress-text">0 / 0</span>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
          </div>
        </div>
        <div class="timer" id="timer" style="display:none">00:00</div>
      </div>
    </div>

    <div id="questions-container"></div>

    <div class="exam-actions">
      <button class="submit-btn" id="submit-btn" onclick="submitExam()">Submit Exam ✓</button>
    </div>
  </div>

  <!-- ══════════ SCORE SCREEN ══════════ -->
  <div id="score-screen">
    <div class="score-card">
      <div class="score-fraction" id="score-fraction">—</div>
      <div class="score-label">Questions Correct</div>
      <div class="score-circle-wrap">
        <div class="score-circle" id="score-circle" style="--pct: 0%">
          <div class="score-circle-inner">
            <div class="score-pct" id="score-pct">0%</div>
            <div class="score-pct-label">Score</div>
          </div>
        </div>
      </div>
      <div class="score-message" id="score-message"></div>
      <div class="score-detail-grid">
        <div class="score-detail-chip"><strong id="sd-correct">0</strong>Correct</div>
        <div class="score-detail-chip"><strong id="sd-wrong">0</strong>Incorrect</div>
        <div class="score-detail-chip"><strong id="sd-time">—</strong>Time Taken</div>
      </div>
    </div>
    <div style="text-align:center; margin-bottom: 32px;">
      <button class="retake-btn" onclick="retakeExam()">Retake Exam</button>
      <button class="review-btn" onclick="reviewExam()">Review Answers</button>
      <br><br>
      <button class="back-btn" style="margin-top:0" onclick="goBack()">← Back to Setup</button>
    </div>
  </div>

</div><!-- /container -->

<script src="app.js"></script>
</body>
</html>
